<!-- KL custom shirt on the custom design page (/product/customize/, 22544), 5.11.2026.
     Added at the end of the picker HTML widget (2755df3), after kl-custom-picker.html. It adds:
       1. two product tiles under the page title (hat, shirt "חדש" ↓)
       2. a black card right after the hat button ("גם חולצה בעיצוב אישי ↓")
       3. a running strip and the shirt block under the hat block (row 79176d6), with its own colours, sizes and button
     The button posts the shirt product form (25259, /product/custom-shirt/) with zdesign=new, the same way the hat
     button does, so Zakeke opens for the chosen colour and size.
     KL_ADMIN_ONLY: while true, only people who see the WordPress admin bar get any of this. -->
<style>
.kl-ptiles,.kl-peek,.kl-band,#kl-shirt{--ink:#171717;--muted:#6B6B69;--line:#DDD3BD;--gold:#AE8E42;--cream:#F4EEE1;--soft:#F4F4F2;font-family:Heebo,sans-serif;color:var(--ink)}
/* 1. tiles */
.kl-ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.kl-ptile{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;text-align:right;font:inherit;color:var(--ink)}
.kl-ptile img{width:52px;height:52px;object-fit:contain;flex:0 0 52px}
.kl-ptile b{display:block;font-size:17px;font-weight:900;line-height:1.1}
.kl-ptile small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kl-ptile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);cursor:default}
.kl-ptile .kl-tag{position:absolute;top:-10px;left:10px}
.kl-ptile .dn{margin-right:auto;width:30px;height:30px;border-radius:4px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 30px}
.kl-tag{display:inline-block;background:var(--ink);color:var(--gold);font-size:11px;font-weight:700;padding:1px 7px;line-height:1.6;letter-spacing:0}
/* 2. card after the hat button */
.kl-peek{display:flex;align-items:center;gap:14px;margin-top:18px;max-width:520px;background:var(--ink);color:#fff;padding:12px;border-radius:4px;cursor:pointer;border:0;width:100%;text-align:right;font:inherit}
.kl-peek img{width:92px;height:92px;object-fit:contain;background:#fff;flex:0 0 92px}
.kl-peek b{display:block;font-size:19px;font-weight:900;margin-top:6px;color:#fff}
.kl-peek small{display:block;color:var(--cream);font-size:13px;margin-top:2px}
.kl-peek .kl-tag{border:1px solid var(--gold)}
.kl-peek .arr{margin-right:auto;flex:0 0 44px;width:44px;height:44px;border-radius:4px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:20px}
/* 3. strip + shirt block */
.kl-band{margin:48px calc(50% - 50vw) 0;background:var(--ink);color:var(--cream);overflow:hidden;white-space:nowrap;padding:15px 0;font-size:19px;font-weight:900}
.kl-band span{display:inline-block;animation:klmarq 30s linear infinite}
.kl-band i{font-style:normal;color:var(--gold);margin:0 16px}
@keyframes klmarq{to{transform:translateX(33.333%)}}
#kl-shirt{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start;padding:44px 0 8px;scroll-margin-top:90px}
#kl-shirt .g-main{aspect-ratio:1/1;display:grid;place-items:center;background:#fff;border:1px solid #EEE9DD}
#kl-shirt .g-main img{width:90%;height:90%;object-fit:contain}
#kl-shirt .g-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
#kl-shirt .g-thumbs button{position:relative;border:1px solid var(--line);background:#fff;padding:0;cursor:pointer;aspect-ratio:1/1;border-radius:0}
#kl-shirt .g-thumbs button.on{border-color:var(--ink)}
#kl-shirt .g-thumbs img{width:100%;height:100%;object-fit:contain;display:block}
#kl-shirt .g-thumbs span{position:absolute;bottom:4px;right:4px;font-size:11px;background:#fff;padding:0 4px}
#kl-shirt h2{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1.1;margin:0 0 8px;color:var(--ink)}
#kl-shirt h2::before{content:"";display:block;width:28px;height:4px;background:var(--gold);margin:0 0 14px auto}
#kl-shirt h2 em{font-style:normal;color:var(--gold)}
#kl-shirt h2 .kl-tag{font-size:12px;padding:2px 8px;margin-right:10px;vertical-align:6px}
#kl-shirt .sub{font-size:18px;font-weight:500;color:var(--muted);margin:0 0 18px}
#kl-shirt .note{font-size:17px;font-weight:900;margin:0 0 20px;padding:10px 14px;background:var(--soft);border-right:3px solid var(--gold)}
#kl-shirt .step{margin-bottom:20px}
#kl-shirt .label{font-weight:900;font-size:15px;margin-bottom:10px;letter-spacing:.02em}
#kl-shirt .label span{color:var(--muted);font-weight:500}
#kl-shirt .label i{font-style:normal}
#kl-shirt .n-m{display:none}
#kl-shirt .colors{display:flex;flex-wrap:wrap;gap:10px}
#kl-shirt .color{position:relative;width:46px;height:46px;border-radius:50%;border:0;padding:4px;background:#fff;box-shadow:inset 0 0 0 1px #CFC6B2;cursor:pointer}
#kl-shirt .color i{display:block;width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center}
#kl-shirt .color.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
#kl-shirt .color.on::after{content:"✓";position:absolute;top:-6px;left:-6px;width:20px;height:20px;background:var(--ink);color:#fff;border-radius:50%;font-size:11px;font-weight:700;line-height:20px;text-align:center}
#kl-shirt .sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#kl-shirt .size{min-height:46px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:0}
#kl-shirt .size.on{background:var(--ink);color:#fff}
#kl-shirt .go{width:100%;max-width:340px;min-height:58px;border:1px solid var(--ink);border-radius:4px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:17px;letter-spacing:.04em;cursor:pointer;margin-top:4px;padding:0 26px}
#kl-shirt .go:hover{opacity:.86}
#kl-shirt .go:disabled{background:#BDBDBA;border-color:#BDBDBA;cursor:default;opacity:1}
#kl-shirt .list{margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;font-size:14px;line-height:2}
#kl-shirt .list a{color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);text-decoration:none}
#kl-shirt .pv{display:none}
#kl-shirt button:focus-visible,.kl-ptile:focus-visible,.kl-peek:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:1024px){#kl-shirt{gap:32px}}
@media (max-width:767px){
  .kl-ptile{padding:7px 8px}
  .kl-ptile img{width:44px;height:44px;flex-basis:44px}
  .kl-ptile b{font-size:16px}
  .kl-ptile small{font-size:11px}
  .kl-ptile .dn{width:26px;height:26px;flex-basis:26px}
  .kl-ptiles{margin-bottom:16px}
  .kl-peek{max-width:none}
  .kl-band{margin-top:34px;font-size:16px;padding:12px 0}
  #kl-shirt{display:block;padding-top:28px}
  #kl-shirt .gal{display:none}
  #kl-shirt h2{font-size:26px}
  #kl-shirt .pv{display:block;position:relative;border:1px solid var(--line);margin-bottom:22px;padding:46px 0 100px;text-align:center}
  #kl-shirt .pv img{width:78%;aspect-ratio:1/1;object-fit:contain}
  #kl-shirt .chip{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;display:flex;align-items:center;gap:8px}
  #kl-shirt .chip i{width:14px;height:14px;border-radius:50%;background-size:cover;box-shadow:0 0 0 1.5px #fff}
  #kl-shirt .side{position:absolute;top:12px;left:12px;display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
  #kl-shirt .side button{border:0;background:#fff;color:var(--ink);font:inherit;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer}
  #kl-shirt .side button.on{background:var(--ink);color:#fff}
  #kl-shirt .cbar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;background:#fff;border-top:1px solid var(--line)}
  #kl-shirt .cbar .cl{font-size:12px;color:var(--muted);margin-bottom:6px}
  #kl-shirt .cbar .colors{justify-content:center;gap:8px;flex-wrap:nowrap;padding:6px 8px}
  #kl-shirt .cbar .color{width:38px;height:38px;flex:0 0 38px;padding:3px}
  #kl-shirt .step-color{display:none}
  #kl-shirt .n-d{display:none}
  #kl-shirt .n-m{display:inline}
  #kl-shirt .sizes{grid-template-columns:repeat(3,1fr)}
  #kl-shirt .go{max-width:none}
}
/* the theme paints every button pink (#c36) on hover and focus; keep ours in the brand colours */
.kl-ptiles .kl-ptile,.kl-ptiles .kl-ptile:hover,.kl-ptiles .kl-ptile:focus,.kl-ptiles .kl-ptile:active{background:#fff;color:var(--ink)}
.kl-ptiles button.kl-ptile:hover{border-color:var(--ink)}
.kl-peek,.kl-peek:hover,.kl-peek:focus,.kl-peek:active{background:var(--ink);color:#fff}
.kl-peek:hover .arr{background:var(--gold);color:var(--ink)}
#kl-shirt .color,#kl-shirt .color:hover,#kl-shirt .color:focus,#kl-shirt .color:active{background:#fff}
#kl-shirt .size:hover,#kl-shirt .size:focus,#kl-shirt .size:active{background:#fff;color:var(--ink)}
#kl-shirt .size.on,#kl-shirt .size.on:hover,#kl-shirt .size.on:focus{background:var(--ink);color:#fff}
#kl-shirt .g-thumbs button:hover,#kl-shirt .g-thumbs button:focus{background:#fff}
#kl-shirt .side button:hover,#kl-shirt .side button:focus{background:#fff;color:var(--ink)}
#kl-shirt .side button.on,#kl-shirt .side button.on:hover,#kl-shirt .side button.on:focus{background:var(--ink);color:#fff}
#kl-shirt .go:hover,#kl-shirt .go:focus,#kl-shirt .go:active{background:var(--ink);color:#fff;border-color:var(--ink)}
#kl-shirt .go:disabled,#kl-shirt .go:disabled:hover,#kl-shirt .go:disabled:focus{background:#BDBDBA;border-color:#BDBDBA;color:#fff}
/* Zakeke open on this page: only the customizer */
body:has(#zakeke-container) .kl-ptiles,body:has(#zakeke-container) .kl-peek,body:has(#zakeke-container) .kl-band,body:has(#zakeke-container) #kl-shirt{display:none !important}
@media (prefers-reduced-motion:reduce){.kl-band span{animation:none}}
</style>
<script>
(function () {
  var KL_ADMIN_ONLY = true;
  var PRODUCT = 25259, URL = '/product/custom-shirt/';
  var UP = '/wp-content/uploads/2026/11/kl-custom-tee-';
  var HAT_IMG = '/wp-content/uploads/2025/12/%D7%A6%D7%91%D7%A2-%D7%A9%D7%97%D7%95%D7%A8-2.png';
  var COLORS = [['black', 'שחור'], ['white', 'לבן'], ['brown', 'חום'], ['sage', 'ירוק מרווה'], ['skyblue', 'תכלת'], ['lavender', 'סגול בהיר']];
  var SIZES = ['S', 'M', 'L', 'XL', 'XXL', '3XL'];
  // variation ids of product 25259, colour × size
  var VAR = {"black":{"S":25261,"M":25262,"L":25263,"XL":25264,"XXL":25265,"3XL":25266},"white":{"S":25267,"M":25268,"L":25269,"XL":25270,"XXL":25271,"3XL":25272},"brown":{"S":25273,"M":25274,"L":25275,"XL":25276,"XXL":25277,"3XL":25278},"sage":{"S":25279,"M":25280,"L":25281,"XL":25282,"XXL":25283,"3XL":25284},"skyblue":{"S":25285,"M":25286,"L":25287,"XL":25288,"XXL":25289,"3XL":25290},"lavender":{"S":25291,"M":25292,"L":25293,"XL":25294,"XXL":25295,"3XL":25296}};
  var img = function (c, s) { return UP + c + '-' + s + '.jpg'; };

  function init() {
    if (document.getElementById('kl-shirt') || document.getElementById('zakeke-container')) return;
    if (KL_ADMIN_ONLY && !document.body.classList.contains('admin-bar')) return;
    var row = document.querySelector('.elementor-22544 [data-id="79176d6"]');
    var picker = document.getElementById('kl-picker');
    if (!row || !picker || !picker.querySelector('.klp-bar')) return setTimeout(init, 300);

    function toShirt() { document.getElementById('kl-shirt').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

    // 1. tiles at the top of the picker (right under the title)
    var tiles = document.createElement('div');
    tiles.className = 'kl-ptiles';
    tiles.innerHTML = '<div class="kl-ptile on" aria-current="true"><img src="' + HAT_IMG + '" alt=""><span><b>כובע</b><small>Dad Cap או בייסבול</small></span></div>' +
      '<button type="button" class="kl-ptile" aria-label="לעיצוב חולצה, למטה בעמוד"><span class="kl-tag">חדש</span><img src="' + img('black', 'front') + '" alt=""><span><b>חולצה</b><small>הדפס בחזית ובגב</small></span><span class="dn">↓</span></button>';
    picker.insertBefore(tiles, picker.firstChild);
    tiles.querySelector('button').onclick = toShirt;

    // 2. black card right after the hat button
    var peek = document.createElement('button');
    peek.type = 'button'; peek.className = 'kl-peek';
    peek.innerHTML = '<img src="' + img('black', 'front') + '" alt=""><span><span class="kl-tag">חדש</span><b>גם חולצה בעיצוב אישי</b><small>הלוגו או הטקסט שלכם, בחזית ובגב</small></span><span class="arr">↓</span>';
    picker.querySelector('.klp-bar').after(peek);
    peek.onclick = toShirt;

    // 3. running strip + the shirt block under the hat row
    var band = document.createElement('div');
    band.className = 'kl-band'; band.setAttribute('aria-hidden', 'true');
    var t = '<i>✱</i> חדש בעיצוב אישי: חולצות <i>✱</i> הלוגו או הטקסט שלכם <i>✱</i> הדפס בחזית ובגב <i>✱</i> גם חולצה אחת ';
    band.innerHTML = '<span>' + t + t + t + '</span>';
    var box = document.createElement('section');
    box.id = 'kl-shirt'; box.setAttribute('aria-label', 'חולצה בעיצוב אישי');
    box.innerHTML =
      '<div class="gal"><div class="g-main"><img class="gimg" alt=""></div><div class="g-thumbs"></div></div>' +
      '<div class="info">' +
        '<h2>חולצה בעיצוב אישי<em>.</em><span class="kl-tag">חדש</span></h2>' +
        '<p class="sub">חולצה עם הלוגו או הטקסט שלכם</p>' +
        '<div class="note">חולצת טי רחבה · הדפס בחזית ובגב</div>' +
        '<div class="pv"><div class="chip"><i class="pdot"></i><span class="pname"></span></div><div class="side"></div><img class="pimg" alt="">' +
          '<div class="cbar"><div class="cl"></div><div class="colors pcolors" role="radiogroup" aria-label="צבע"></div></div></div>' +
        '<div class="step step-color"><div class="label clabel"></div><div class="colors dcolors" role="radiogroup" aria-label="צבע"></div></div>' +
        '<div class="step"><div class="label"><i class="n-d">2.</i><i class="n-m">1.</i> בוחרים מידה <span class="sname"></span></div><div class="sizes" role="radiogroup" aria-label="מידה"></div></div>' +
        '<button type="button" class="go"></button>' +
        '<div class="list">✓ בלי מינימום, גם חולצה אחת<br>✓ הדפס DTG בצבע מלא, בחזית ובגב, עד A3<br>✓ משלוח עד 5 ימי עסקים, או איסוף מנחלת בנימין 13<br>✓ תקועים? <a href="https://wa.me/97239385005" target="_blank" rel="noopener">כתבו לנו ב-WhatsApp</a></div>' +
      '</div>';
    row.after(band);
    band.after(box);

    var q = function (s) { return box.querySelector(s); };
    var st = { c: 0, side: 'front', size: null };

    function colorBtns(el) {
      el.innerHTML = '';
      COLORS.forEach(function (c, i) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'color' + (i === st.c ? ' on' : '');
        b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === st.c); b.setAttribute('aria-label', c[1]); b.title = c[1];
        b.innerHTML = '<i style="background-image:url(\'' + img(c[0], 'swatch') + '\')"></i>';
        b.onclick = function () { st.c = i; render(); };
        el.appendChild(b);
      });
    }
    function render() {
      var c = COLORS[st.c];
      q('.clabel').innerHTML = '1. בוחרים צבע <span>· ' + c[1] + '</span>';
      colorBtns(q('.dcolors')); colorBtns(q('.pcolors'));
      q('.cl').textContent = 'בוחרים צבע · ' + c[1];
      var main = img(c[0], st.side);
      q('.gimg').src = main; q('.pimg').src = main;
      q('.gimg').alt = q('.pimg').alt = 'חולצה בעיצוב אישי, ' + c[1] + ', ' + (st.side === 'front' ? 'חזית' : 'גב');
      q('.pdot').style.backgroundImage = 'url(\'' + img(c[0], 'swatch') + '\')';
      q('.pname').textContent = 'חולצה · ' + c[1];
      var th = q('.g-thumbs'), ps = q('.side');
      th.innerHTML = ''; ps.innerHTML = '';
      [['front', 'חזית'], ['back', 'גב']].forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = st.side === s[0] ? 'on' : ''; b.setAttribute('aria-label', s[1]);
        b.innerHTML = '<img src="' + img(c[0], s[0]) + '" alt=""><span>' + s[1] + '</span>';
        b.onclick = function () { st.side = s[0]; render(); };
        th.appendChild(b);
        var t2 = document.createElement('button');
        t2.type = 'button'; t2.className = b.className; t2.textContent = s[1]; t2.onclick = b.onclick;
        ps.appendChild(t2);
      });
      var sz = q('.sizes'); sz.innerHTML = '';
      SIZES.forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'size' + (st.size === s ? ' on' : ''); b.textContent = s;
        b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', st.size === s);
        b.onclick = function () { st.size = s; render(); };
        sz.appendChild(b);
      });
      q('.sname').textContent = st.size ? '· ' + st.size : '';
      var go = q('.go');
      go.disabled = !st.size;
      go.textContent = st.size ? 'התחילו לעצב ←' : 'בחרו מידה';
    }
    // same fields as the form on the shirt product page; Zakeke opens there for this colour and size
    q('.go').onclick = function () {
      if (!st.size) return;
      var c = COLORS[st.c][0];
      var f = document.createElement('form');
      f.method = 'post'; f.action = URL; f.style.display = 'none';
      var fields = { 'attribute_pa_shirt-color': c, 'attribute_pa_hat-size': st.size.toLowerCase(), 'quantity': '1', 'yith-wacp-is-excluded': 'yes',
        'zdesign': 'new', 'add-to-cart': String(PRODUCT), 'product_id': String(PRODUCT), 'variation_id': String(VAR[c][st.size]) };
      Object.keys(fields).forEach(function (k) { var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = fields[k]; f.appendChild(i); });
      document.body.appendChild(f);
      f.submit();
    };
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
