<script>
/* footer link groups open with a tap on phones (2.11.2026). Until this runs, every link stays visible */
(function () {
  var mq = window.matchMedia('(max-width: 767px)');
  var pairs = [['89944d4', 'b58b024'], ['a6e765d', '8354ca3'], ['9a98036', '5f3e923']];
  function q(id) { return document.querySelector('[data-id="' + id + '"]'); }
  function init() {
    var items = [];
    pairs.forEach(function (p) { var h = q(p[0]), b = q(p[1]); if (h && b) items.push({ h: h, b: b }); });
    var st = document.querySelector('.kl-fstore'), sh = st && st.querySelector('.kl-fh');
    if (sh) items.push({ h: sh, b: st });
    if (!items.length) return;
    items.forEach(function (it, i) {
      if (!it.b.id) it.b.id = 'kl-facc-' + i;
      function toggle() {
        var open = it.h.getAttribute('aria-expanded') !== 'true';
        it.h.setAttribute('aria-expanded', open ? 'true' : 'false');
        it.b.classList.toggle('kl-open', open);
      }
      it.h.addEventListener('click', function () { if (mq.matches) toggle(); });
      it.h.addEventListener('keydown', function (e) {
        if (mq.matches && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(); }
      });
    });
    function apply() {
      items.forEach(function (it) {
        if (mq.matches) {
          it.h.setAttribute('role', 'button');
          it.h.setAttribute('tabindex', '0');
          it.h.setAttribute('aria-controls', it.b.id);
          if (!it.h.hasAttribute('aria-expanded')) it.h.setAttribute('aria-expanded', 'false');
        } else {
          ['role', 'tabindex', 'aria-controls', 'aria-expanded'].forEach(function (a) { it.h.removeAttribute(a); });
          it.b.classList.remove('kl-open');
        }
      });
    }
    apply();
    if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply);
    document.documentElement.classList.add('kl-facc');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
