<!doctype html>
<!-- 5.11.2026: opened inside the Zakeke admin as a hidden frame. It reads the prepared shirt photos from this folder
     and hands them to the Zakeke page (and only to it), so they can be uploaded there without the file dialog. -->
<html><head><meta charset="utf-8"></head><body><script>
var files = (new URLSearchParams(location.search).get('files') || '').split(',').filter(Boolean);
files.forEach(function (name) {
  if (!/^kl-custom-tee-[a-z]+-(front|back)\.jpg$/.test(name)) return;
  fetch(name).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
    parent.postMessage({ kind: 'kl-file', name: name, buf: buf }, 'https://admin.zakeke.com', [buf]);
  });
});
</script></body></html>
