<script>
(function () {
  var done = false;
  function q(id) { return document.querySelector('[data-id="' + id + '"]'); }
  function run() {
    if (done) return; done = true;
    document.body.classList.add('kl-mock');

    // one "new in store" block: the newest 3 hats and the newest 3 shirts, side by side
    var hatsW = q('8d29aa4'), wearSec = q('61b9e5b');
    var wearW = wearSec && wearSec.querySelector('[data-widget_type^="woocommerce-products"]');
    if (hatsW && wearW) {
      var strip = document.createElement('div'); strip.className = 'kl-new-strip';
      hatsW.parentNode.insertBefore(strip, hatsW);
      [hatsW, wearW].forEach(function (w, wi) {
        strip.appendChild(w);
        var ul = w.querySelector('ul.products');
        for (var el = ul; el && el !== strip; el = el.parentElement) {
          el.classList.add('kl-contents');
          // anything else inside the wrappers would take a cell of the row
          Array.prototype.forEach.call(el.children, function (c) {
            if (c.tagName !== 'LI' && !c.contains(ul)) c.classList.add('kl-hide');
          });
        }
        Array.prototype.forEach.call(ul.children, function (li, i) {
          if (i > 2) li.classList.add('kl-hide'); else li.style.order = String(i * 2 + wi + 1);
        });
      });
      wearSec.classList.add('kl-hide');
      var t = q('6f1a4c1'); if (t) t.textContent = 'חדש בחנות';
      var a = q('a175427'); if (a) { a.textContent = 'לכל המוצרים ←'; a.setAttribute('href', 'https://keterlion.com/staging/all-products/'); }
    }

    // hat types: the "all hats" button gets the same look as the link in the "new" block
    var allHats = q('fb8ef72'), newLink = q('a175427');
    if (allHats && newLink) allHats.className = newLink.className;

    // custom design: no picker and no price, one button to the design page
    var picker = q('d5efd5e'); if (picker) picker.classList.add('kl-hide');
    var heroBtn = q('4406150'), para = q('3e43e5e');
    if (heroBtn && para) {
      var wrap = document.createElement('div'); wrap.className = 'kl-cta';
      var b = heroBtn.cloneNode(true); b.textContent = 'להתחיל לעצב ←';
      b.setAttribute('href', 'https://keterlion.com/staging/product/customize/');
      wrap.appendChild(b); para.after(wrap);
    }
  }
  window.addEventListener('load', run);
  setTimeout(run, 4000);
})();
</script>
