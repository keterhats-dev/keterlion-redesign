<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סרטון עיצוב אישי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Suez+One&family=Frank+Ruhl+Libre:wght@900&family=Secular+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
:root{--bg:#ECEAE4;--ink:#171717}
body{margin:0;background:var(--bg);font-family:Heebo,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
canvas{width:min(405px,92vw);height:auto;box-shadow:0 12px 40px rgba(0,0,0,.12);background:#fff}
.bar{display:flex;gap:10px;align-items:center;font-size:14px;color:#6B6B69}
button{font:inherit;border:1px solid var(--ink);background:#fff;border-radius:4px;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar"><button id="play">▶ נגן מההתחלה</button><span id="tm">0.0s</span></div>
<script>
const W=1080,H=1920,FPS=30,DUR=19;
const C={ink:'#171717',white:'#FFFFFF',gold:'#AE8E42',cream:'#F4EEE1',line:'#DDD3BD',mute:'#6B6B69',red:'#C21A1A',paper:'#F4F4F2'};
const cv=document.getElementById('c'),x=cv.getContext('2d');

// ---------- assets ----------
const SRC={lion:'img/lion.png',wm:'img/wordmark.png',base:'img/base-black.png',
  black:'img/cap-black.png',pink:'img/cap-pink.png',blue:'img/cap-blue.png',green:'img/cap-green.png',
  purple:'img/cap-purple.png',mustard:'img/cap-mustard.png',navy:'img/cap-navy.png',bordo:'img/cap-bordo.png',red:'img/cap-red.png',cream:'img/cap-cream.png'};
const IM={};
// make the near-white photo background transparent so hats sit on white or black
function knock(i){const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const g=c.getContext('2d');g.drawImage(i,0,0);
  const d=g.getImageData(0,0,c.width,c.height),p=d.data;
  for(let j=0;j<p.length;j+=4){const m=Math.min(p[j],p[j+1],p[j+2]),M=Math.max(p[j],p[j+1],p[j+2]);if(M-m<14&&m>232)p[j+3]=Math.round(p[j+3]*Math.max(0,(250-m)/18));}
  g.putImageData(d,0,0);return c;}
function load(){return Promise.all(Object.entries(SRC).map(([k,s])=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{IM[k]=(k==='lion'||k==='wm')?i:knock(i);res()};i.onerror=rej;i.src=s})))}
async function fonts(){await Promise.all(['400 20px Heebo','500 20px Heebo','700 20px Heebo','900 20px Heebo','20px "Suez One"','900 20px "Frank Ruhl Libre"','20px "Secular One"'].map(f=>document.fonts.load(f,'אבג abc')));}

// swatches (order on screen, right to left) – hex approximates the cap images
const SW=[['black','#1d1d1d','שחור'],['cream','#ECE7DA','שמנת'],['pink','#EFA9B8','ורוד'],['blue','#8FB7D6','תכלת'],['green','#2F5D46','ירוק'],['purple','#9B86C4','סגול'],['mustard','#C99A3C','חרדל'],['navy','#1F2C44','נייבי'],['bordo','#6E1F2D','בורדו'],['red','#C8282E','אדום']];
const THREAD=[['#171717','שחור'],['#AE8E42','זהב'],['#C21A1A','אדום'],['#FFFFFF','לבן'],['#1F3A6B','כחול']];
const FONTS=[['900 {s}px Heebo','בלוק'],['{s}px "Suez One"','סטריט'],['900 {s}px "Frank Ruhl Libre"','קלאסי']];

// ---------- easing / helpers ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3), eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function txt(s,X,Y,font,col,align='right',alpha=1){x.save();x.globalAlpha*=alpha;x.font=font;x.fillStyle=col;x.textAlign=align;x.direction='rtl';x.textBaseline='alphabetic';x.fillText(s,X,Y);x.restore();}
function tw(s,font){x.save();x.font=font;x.direction='rtl';const w=x.measureText(s).width;x.restore();return w}

// ---------- scene pieces ----------
function ticker(t,dark){
  x.fillStyle=C.ink;x.fillRect(0,0,W,84);
  const items=['בלי מינימום','גם כובע אחד','רקמה על כובע','עד 5 ימי עסקים'];
  x.save();x.beginPath();x.rect(0,0,W,84);x.clip();
  let X=W+((t*90)%640)-40; // drifts right (RTL reading)
  for(let k=0;k<10;k++){for(const s of items){txt(s,X,55,'500 30px Heebo',C.cream);X-=tw(s,'500 30px Heebo')+28;txt('✱',X,55,'700 30px Heebo',C.gold);X-=58;}}
  x.restore();
}
function brand(Y,dark){
  const l=IM.lion,wm=IM.wm;const lh=74,lw=l.width*lh/l.height, wh=30,ww=wm.width*wh/wm.height;
  x.save();if(dark)x.filter='invert(1)';
  x.drawImage(l,W-72-lw,Y-lh/2,lw,lh);x.drawImage(wm,W-72-lw-18-ww,Y-wh/2+2,ww,wh);
  x.restore();
  x.fillStyle=C.gold;x.beginPath();x.arc(W-72-lw-18-ww-12,Y+12,6,0,7);x.fill();
}
function hat(key,alpha,cx,cy,size){
  const i=IM[key];if(!i||alpha<=0)return;
  const k=key==='base'?1.38:1; const s=size*k;
  x.save();x.globalAlpha=alpha;
  x.drawImage(i,cx-s/2,cy-s/2+(key==='base'?size*0.07:0),s,s);x.restore();
}
// "embroidery" on the front panel
function emb(str,font,col,cx,cy,alpha=1){
  if(!str)return;x.save();x.globalAlpha=alpha;x.font=font;x.textAlign='center';x.direction='rtl';x.textBaseline='middle';
  x.fillStyle='rgba(0,0,0,.22)';x.fillText(str,cx,cy+2);
  x.fillStyle=col;x.fillText(str,cx,cy);
  // stitch texture
  x.globalCompositeOperation='source-atop';x.globalAlpha=alpha*.12;x.strokeStyle='#000';x.lineWidth=1;
  x.restore();
}
function tap(X,Y,t,t0){ // finger tap ring
  const p=seg(t,t0-.25,t0+.35);if(p<=0||p>=1)return;
  const a=p<.4?p/.4:1-(p-.4)/.6;
  x.save();x.globalAlpha=a*.9;x.fillStyle='rgba(23,23,23,.18)';x.beginPath();x.arc(X,Y,34+p*26,0,7);x.fill();
  x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();x.arc(X,Y,30,0,7);x.stroke();x.restore();
}
function sticker(cx,cy,r,rot,scale,lines,alpha=1,inv=false){
  if(scale<=0)return;x.save();x.globalAlpha=alpha;x.translate(cx,cy);x.rotate(rot);x.scale(scale,scale);
  x.fillStyle=inv?C.cream:C.ink;x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.font=`${r*.36}px "Suez One"`;x.fillStyle=inv?C.ink:C.white;x.textAlign='center';x.direction='rtl';x.textBaseline='middle';
  lines.forEach((s,j)=>x.fillText(s,0,(j-(lines.length-1)/2)*r*.4));x.restore();
}
function btn(label,X,Y,w,h,sel,alpha=1,dark=false){
  x.save();x.globalAlpha=alpha;rr(X,Y,w,h,6);
  if(sel){x.fillStyle=dark?C.white:C.ink;x.fill();}else{x.fillStyle=C.white;x.fill();x.lineWidth=2;x.strokeStyle=C.ink;x.stroke();}
  x.font='700 40px Heebo';x.fillStyle=sel?(dark?C.ink:C.white):C.ink;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText(label,X+w/2,Y+h/2+2);x.restore();
}
// step header: progress 4 parts + kicker + title (slides in)
const STEPS=[['בוחרים גזרה','Dad Cap או בייסבול'],['בוחרים צבע','19 צבעים'],['מעצבים','טקסט, לוגו או עיצוב מוכן'],['מוסיפים לסל','ויוצאים לרקמה']];
function header(n,t,t0){
  brand(170,false);
  // progress
  const pw=(W-144-3*14)/4;
  for(let k=0;k<4;k++){const X=W-72-(k+1)*pw-k*14;x.fillStyle=C.line;x.fillRect(X,250,pw,6);
    const f=k<n?1:k>n?0:eo(seg(t,t0,t0+.5));x.fillStyle=C.ink;x.fillRect(X+pw*(1-f),250,pw*f,6);}
  const p=eo(seg(t,t0,t0+.45));
  x.save();x.globalAlpha=p;x.translate((1-p)*-60,0);
  x.fillStyle=C.gold;x.fillRect(W-72-44,318,44,5);
  txt(`שלב ${n+1} מתוך 4`,W-72-60,334,'500 34px Heebo',C.mute);
  txt(STEPS[n][0],W-72,470,'900 128px Heebo',C.ink);
  const tWid=tw(STEPS[n][0],'900 128px Heebo');x.fillStyle=C.gold;x.beginPath();x.arc(W-72-tWid-22,452,13,0,7);x.fill();
  txt(STEPS[n][1],W-72,540,'400 40px Heebo',C.mute);
  x.restore();
}

// ---------- the timeline ----------
// 0–2.2 intro · 2.2–5.4 cut · 5.4–9.2 colour · 9.2–14.2 design · 14.2–16.6 cart · 16.6–19 end
const HX=540,HY=1000,HS=1040, EY=HY-HS*0.085; // embroidery centre on dad cap
function frame(t){
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.filter='none';
  x.fillStyle=C.white;x.fillRect(0,0,W,H);

  // ===== INTRO =====
  if(t<2.6){
    const out=eio(seg(t,2.1,2.6)); // wipe up
    x.save();x.translate(0,-out*H);
    x.fillStyle=C.ink;x.fillRect(0,0,W,H);
    brand(200,true);
    const a=eo(seg(t,.15,.7)),b=eo(seg(t,.45,1.0));
    x.save();x.globalAlpha=a;x.translate(0,(1-a)*40);
    txt('KETERLION BY YOU',W-72,700,'500 40px Heebo',C.gold);
    txt('כובע',W-72,880,'900 190px Heebo',C.cream);
    x.restore();
    x.save();x.globalAlpha=b;x.translate(0,(1-b)*40);
    txt('בעיצוב אישי',W-72,1060,'900 168px Heebo',C.cream);
    x.restore();
    const c=eo(seg(t,.9,1.4));
    x.save();x.globalAlpha=c;
    txt('ב-4 צעדים',W-72,1220,'900 110px Heebo',C.white);
    const ww=tw('ב-4 צעדים','900 110px Heebo');x.fillStyle=C.gold;x.beginPath();x.arc(W-72-ww-20,1205,12,0,7);x.fill();
    x.restore();
    sticker(250,1560,170,-.2,back(seg(t,1.2,1.65)),['גם','כובע','אחד'],1,true);
    // white sticker ring on black so it reads
    x.restore();
    if(out<1){ /* white page shows underneath next */ }
    if(t<2.1)return;
  }

  ticker(t);

  // ===== STEP 1: cut =====
  if(t>=2.1&&t<5.6){
    const t0=2.3;header(0,t,t0);
    const sw=eio(seg(t,3.9,4.3)); // switch baseball -> dad cap
    const pop=eo(seg(t,2.4,2.9));
    x.save();x.globalAlpha=pop;
    hat('base',1-sw,HX,HY,HS);hat('black',sw,HX,HY,HS);
    x.restore();
    txt(sw<.5?'בייסבול · גזרה גבוהה ומובנית':'Dad Cap · גזרה נמוכה ורכה',W/2,1480,'500 38px Heebo',C.mute,'center',pop);
    const by=1540,bw=(W-144-20)/2;
    btn('בייסבול',72,by,bw,110,sw<.5,eo(seg(t,2.6,3.0)));
    btn('Dad Cap',72+bw+20,by,bw,110,sw>=.5,eo(seg(t,2.6,3.0)));
    tap(72+bw+20+bw/2,by+55,t,3.95);
  }

  // ===== STEP 2: colour =====
  const seq=['black','pink','blue','green','purple','cream']; const st=[5.6,6.15,6.7,7.25,7.8,8.35];
  if(t>=5.6&&t<9.4){
    header(1,t,5.6);
    let cur=0;for(let k=0;k<st.length;k++)if(t>=st[k])cur=k;
    const f=eio(seg(t,st[cur],st[cur]+.25));
    if(cur>0)hat(seq[cur-1],1-f,HX,HY,HS);hat(seq[cur],cur>0?f:1,HX,HY,HS);
    const name=SW.find(s=>s[0]===seq[cur])[2];
    txt('צבע · '+name,W/2,1480,'500 38px Heebo',C.mute,'center');
    // 10 swatches in 2 rows
    const r=46,gap=(W-144-5*2*r)/4;
    SW.forEach(([k,hex],j)=>{const row=j<5?0:1,col=j%5;const cx=W-72-r-col*(2*r+gap),cy=1580+row*124;
      const a=eo(seg(t,5.7+j*.04,6.1+j*.04));
      x.save();x.globalAlpha=a;x.fillStyle=hex;x.beginPath();x.arc(cx,cy,r*a,0,7);x.fill();
      if(k==='cream'){x.strokeStyle=C.line;x.lineWidth=2;x.stroke();}
      if(k===seq[cur]){x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();x.arc(cx,cy,r+10,0,7);x.stroke();}
      x.restore();
      if(k===seq[cur]&&cur>0)tap(cx,cy,t,st[cur]);
    });
  }

  // ===== STEP 3: design =====
  if(t>=9.2&&t<14.4){
    header(2,t,9.4);
    hat('cream',1,HX,HY,HS);
    // tabs
    const tabs=['טקסט','לוגו','עיצוב מוכן'],tb=(W-144-40)/3;
    tabs.forEach((s,j)=>btn(s,W-72-(j+1)*tb-j*20,1440,tb,96,j===0,eo(seg(t,9.5+j*.06,9.9+j*.06))));
    tap(W-72-tb/2,1488,t,9.85);
    // typing
    const word='יאללה',n=Math.floor(cl((t-10.1)/0.16,0,word.length));
    let fi=0;if(t>=11.6)fi=1;if(t>=12.2)fi=2;if(t>=13.4)fi=0;
    let ti=0;if(t>=12.8)ti=1;if(t>=13.2)ti=2;if(t>=13.6)ti=1;
    const fz=fi===2?96:fi===1?104:100;
    emb(word.slice(0,n),FONTS[fi][0].replace('{s}',fz),THREAD[ti][0],HX,EY);
    // caret while typing
    if(t>10&&t<11.1&&Math.floor(t*4)%2===0){const w=tw(word.slice(0,n),FONTS[0][0].replace('{s}',100));x.fillStyle=C.ink;x.fillRect(HX-w/2-10,EY-48,5,96);}
    // font row
    const ra=eo(seg(t,11.2,11.5));
    if(ra>0){txt('פונט',W-72,1610,'500 34px Heebo',C.mute,'right',ra);
      const fw=(W-144-180-40)/3;
      FONTS.forEach(([f,lab],j)=>{const X=W-72-180-(j+1)*fw-j*20;x.save();x.globalAlpha=ra;rr(X,1560,fw,82,6);
        if(j===fi){x.fillStyle=C.ink;x.fill();}else{x.strokeStyle=C.ink;x.lineWidth=2;x.stroke();}
        x.font=f.replace('{s}',38);x.fillStyle=j===fi?C.white:C.ink;x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText(lab,X+fw/2,1603);x.restore();
        if(j===fi&&j>0)tap(X+fw/2,1601,t,j===1?11.6:12.2);});
    }
    // thread row
    const ta=eo(seg(t,12.5,12.8));
    if(ta>0){txt('צבע חוט',W-72,1740,'500 34px Heebo',C.mute,'right',ta);
      THREAD.forEach(([hex],j)=>{const cx=W-72-240-j*120,cy=1728;x.save();x.globalAlpha=ta;x.fillStyle=hex;x.beginPath();x.arc(cx,cy,38,0,7);x.fill();
        if(hex==='#FFFFFF'){x.strokeStyle=C.line;x.lineWidth=2;x.stroke();}
        if(j===ti){x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();x.arc(cx,cy,48,0,7);x.stroke();}x.restore();
        if(j===ti&&j>0)tap(cx,cy,t,[0,12.8,13.2][j]||13.2);});
      if(t>13.6)tap(W-72-240-120,1728,t,13.6);
    }
  }

  // ===== STEP 4: cart =====
  if(t>=14.2&&t<16.9){
    header(3,t,14.4);
    hat('cream',1,HX,HY,HS);
    emb('יאללה',FONTS[0][0].replace('{s}',100),THREAD[1][0],HX,EY);
    const added=t>=15.1, pr=eo(seg(t,15.0,15.15));
    const bw=W-144, by=1450, sq=1-.04*Math.sin(Math.PI*seg(t,14.95,15.2));
    x.save();x.translate(W/2,by+60);x.scale(sq,sq);x.translate(-W/2,-(by+60));
    rr(72,by,bw,120,6);x.fillStyle=C.ink;x.fill();
    txt(added?'✓ נוסף לסל':'הוספה לסל',W/2+(added?0:40),by+78,'700 48px Heebo',C.white,'center',eo(seg(t,14.5,14.8)));
    if(!added){rr(96,by+22,76,76,4);x.fillStyle=C.white;x.fill();txt('←',134,by+76,'700 44px Heebo',C.ink,'center');}
    x.restore();
    tap(W/2,by+60,t,15.0);
    const facts=['בלי מינימום, גם כובע אחד','משלוח עד 5 ימי עסקים','או איסוף מנחלת בנימין 13'];
    facts.forEach((s,j)=>{const a=eo(seg(t,15.3+j*.2,15.6+j*.2));txt('✓',W-72,1680+j*66,'900 40px Heebo',C.gold,'right',a);txt(s,W-72-54,1680+j*66,'500 40px Heebo',C.ink,'right',a);});
    // cart badge pops in the header area
    if(added){const s=back(seg(t,15.1,15.45));sticker(170,700,120,-.18,s,['גם','כובע','אחד']);}
  }

  // ===== END CARD =====
  if(t>=16.6){
    const p=eio(seg(t,16.6,17.0));
    x.save();x.beginPath();x.rect(0,H*(1-p),W,H*p);x.clip();
    x.fillStyle=C.ink;x.fillRect(0,0,W,H);
    brand(200,true);
    const a=eo(seg(t,16.9,17.3)),b=eo(seg(t,17.15,17.55)),c=eo(seg(t,17.5,17.9));
    x.save();x.globalAlpha=a;x.translate(0,(1-a)*40);
    txt('מה שבראש שלך,',W-72,620,'900 118px Heebo',C.cream);
    txt('על הראש שלך',W-72,760,'900 118px Heebo',C.cream);
    const ww=tw('על הראש שלך','900 118px Heebo');x.fillStyle=C.gold;x.beginPath();x.arc(W-72-ww-22,744,13,0,7);x.fill();
    x.restore();
    x.save();x.globalAlpha=b;
    hat('cream',1,W/2,1110,820);
    x.restore();
    emb('יאללה',FONTS[0][0].replace('{s}',74),C.gold,W/2,1110-820*0.085,b);
    x.save();x.globalAlpha=c;
    rr(140,1440,W-280,130,6);x.fillStyle=C.white;x.fill();
    txt('להתחיל לעצב',W/2+44,1525,'700 54px Heebo',C.ink,'center');
    rr(170,1466,78,78,4);x.fillStyle=C.ink;x.fill();txt('←',209,1522,'700 46px Heebo',C.white,'center');
    x.font='500 44px Heebo';x.fillStyle=C.gold;x.textAlign='center';x.direction='ltr';x.letterSpacing='4px';x.fillText('KETERLION.COM',W/2,1660);
    x.restore();
    sticker(880,1020,130,.2,back(seg(t,17.7,18.1)),['גם','כובע','אחד'],1,true);
    x.restore();
  }
}

// ---------- preview player ----------
let start=null,raf;
function loop(ts){if(start===null)start=ts;const t=((ts-start)/1000)%DUR;frame(t);document.getElementById('tm').textContent=t.toFixed(1)+'s';raf=requestAnimationFrame(loop);}
document.getElementById('play').onclick=()=>{start=null;};
window.frame=frame;

// ---------- MP4 export (WebCodecs + mp4-muxer) ----------
async function exportMp4(){
  const {Muxer,ArrayBufferTarget}=Mp4Muxer;
  const target=new ArrayBufferTarget();
  const muxer=new Muxer({target,video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{window.__err=String(e)}});
  let cfg={codec:'avc1.640033',width:W,height:H,bitrate:10_000_000,framerate:FPS,avc:{format:'avc'}};
  if(!(await VideoEncoder.isConfigSupported(cfg)).supported){cfg.codec='avc1.4d0033';}
  if(!(await VideoEncoder.isConfigSupported(cfg)).supported){cfg.codec='avc1.420033';}
  enc.configure(cfg);
  const N=DUR*FPS;
  for(let i=0;i<N;i++){
    frame(i/FPS);
    const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(vf,{keyFrame:i%60===0});vf.close();
    if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));
  }
  await enc.flush();muxer.finalize();
  const buf=new Uint8Array(target.buffer);let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  window.__codec=cfg.codec;window.__mp4=btoa(s);return buf.length;
}
window.exportMp4=exportMp4;

(async()=>{await load();await fonts();window.__ready=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t')){document.body.style.cssText='margin:0;padding:0';cv.style.cssText='width:1080px;box-shadow:none';document.querySelector('.bar').remove();frame(parseFloat(q.get('t')));return;}
  if(q.has('export'))return;
  raf=requestAnimationFrame(loop);})();
</script>
