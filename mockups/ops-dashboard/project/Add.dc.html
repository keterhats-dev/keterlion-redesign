<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>משימה חדשה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&amp;family=Arvo:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
a{color:#171717}a:hover{color:#6b6b69}
.lbl{font-size:15px;font-weight:500;margin:0 0 8px}
.chip{flex:none;height:38px;padding:0 14px;border:1px solid #171717;border-radius:4px;background:#fff;font:500 14px Heebo,Arial,sans-serif;color:#171717}
.chip.on{background:#171717;color:#fff}
.fld{width:100%;box-sizing:border-box;border:1px solid #171717;border-radius:4px;background:#fff;font:400 16px Heebo,Arial,sans-serif;color:#171717;padding:0 14px}
.prio{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid #ddd3bd;border-radius:4px;background:#fff;font-family:Heebo,Arial,sans-serif;color:#171717;text-align:right}
.prio.on{border:2px solid #171717;padding:9px 11px}
</style>
</helmet>
<div style="width:390px;height:980px;box-sizing:border-box;background:#fff;color:#171717;font-family:Heebo,Arial,sans-serif;display:flex;flex-direction:column">
<header style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ddd3bd">
<h1 style="margin:0;font-size:24px;font-weight:900">משימה חדשה<span style="color:#ae8e42">.</span></h1>
<a href="Main.dc.html" aria-label="סגירה" style="width:40px;height:40px;border:1px solid #ddd3bd;border-radius:4px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<main style="padding:20px 16px;display:flex;flex-direction:column;gap:22px;flex-grow:1">
<div>
<label for="t" class="lbl" style="display:block">מה צריך לעשות?</label>
<input id="t" class="fld" style="height:52px" value="להכין ולשלוח הזמנה סיטונאית ל[שם הלקוח]">
</div>

<div>
<p class="lbl">עדיפות</p>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="prio on"><span style="font-size:13px;font-weight:700;background:#171717;color:#fff;padding:1px 7px">דחוף</span><span style="font-size:12px;color:#6b6b69">קודם כול</span></button>
<button class="prio"><span style="font-size:13px;font-weight:700;border:1px solid #171717;padding:0 6px">חשוב</span><span style="font-size:12px;color:#6b6b69">היום או מחר</span></button>
<button class="prio"><span style="font-size:13px;font-weight:500;color:#6b6b69;padding:1px 0">רגיל</span><span style="font-size:12px;color:#6b6b69">כשיש זמן</span></button>
</div>
</div>

<div>
<p class="lbl">תחום</p>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button class="chip">הנהלת חשבונות</button>
<button class="chip">טכני ומערכת</button>
<button class="chip">מלאי בחנות</button>
<button class="chip on">סיטונאות</button>
<button class="chip">הזמנות באתר</button>
<button class="chip">Wolt</button>
<button class="chip">לידים והצעות מחיר</button>
<button class="chip">כללי</button>
</div>
</div>

<div>
<p class="lbl">למי</p>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<button class="chip on" style="height:44px">ארי</button>
<button class="chip" style="height:44px">[השם שלך]</button>
</div>
</div>

<div>
<p class="lbl">מתי</p>
<div style="display:flex;gap:8px">
<button class="chip on">היום</button>
<button class="chip">מחר</button>
<button class="chip">תאריך אחר</button>
<label for="hr" style="position:absolute;width:1px;height:1px;overflow:hidden">שעה</label>
<input id="hr" class="fld" style="height:38px;width:84px;flex:none;text-align:center" value="15:00">
</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #ddd3bd;border-bottom:1px solid #ddd3bd">
<div><div style="font-size:15px;font-weight:500">להוסיף ליומן Google של ארי</div><div style="font-size:13px;color:#6b6b69;margin-top:2px">אירוע ב-15:00 עם תזכורת. מתעדכן כשהמשימה משתנה או מסתיימת</div></div>
<button role="switch" aria-checked="true" aria-label="להוסיף ליומן" style="flex:none;width:52px;height:30px;border:0;border-radius:999px;background:#171717;padding:3px;display:flex;justify-content:flex-start"><span style="width:24px;height:24px;border-radius:999px;background:#fff"></span></button>
</div>

<div>
<label for="n" class="lbl" style="display:block">הערה <span style="font-weight:400;color:#6b6b69">(לא חובה)</span></label>
<textarea id="n" class="fld" style="height:84px;padding:12px 14px;resize:none">[פרטים, קישור או מספר הזמנה]</textarea>
</div>
</main>

<div style="padding:12px 16px 20px;border-top:1px solid #ddd3bd">
<a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:4px;background:#171717;color:#fff;text-decoration:none;font-size:17px;font-weight:700">להוסיף משימה</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
