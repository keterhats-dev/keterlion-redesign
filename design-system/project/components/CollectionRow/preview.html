<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>CollectionRow — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#171717);background:var(--white,#fff)}
.list{margin:12px 0;border-bottom:1px solid var(--line,#ddd3bd)}
.row{display:flex;align-items:center;gap:24px;padding:18px 16px;border-top:1px solid var(--line,#ddd3bd);color:inherit;text-decoration:none}
.row:hover{background:var(--row-hover,#faf8f3)}
.n{width:32px;font-size:16px;font-weight:500;color:var(--grey,#6b6b69)}
.name{flex-grow:1;font-size:56px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.arrow{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-sm,4px);background:var(--black,#171717);color:var(--white,#fff);font-size:24px}
</style></head>
<body>
<div class="list">
  <a class="row" href="#"><span class="n">א׳</span><span class="name">KETERLION</span><span class="arrow" aria-hidden="true">←</span></a>
  <a class="row" href="#"><span class="n">ב׳</span><span class="name">מיינדסט</span><span class="arrow" aria-hidden="true">←</span></a>
  <a class="row" href="#"><span class="n">ג׳</span><span class="name">תמרורים</span><span class="arrow" aria-hidden="true">←</span></a>
</div>
</body>
</html>
