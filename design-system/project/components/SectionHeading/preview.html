<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>SectionHeading — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#171717);background:var(--white,#fff)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:24px 16px;border-top:1px solid var(--line,#ddd3bd);margin-top:12px}
.eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 14px;font-size:13px;font-weight:500;letter-spacing:.24em}
.eyebrow::before{content:"";width:32px;height:4px;background:var(--gold,#ae8e42)}
h2{margin:0;font-size:52px;font-weight:900;line-height:1.05}
.dot{color:var(--gold,#ae8e42)}
.link{font-weight:700;font-size:16px;border-bottom:2px solid var(--gold,#ae8e42);padding-bottom:3px;white-space:nowrap}
</style></head>
<body><div class="sh"><div><p class="eyebrow">עיצוב אישי</p><h2>חדש על המדף<span class="dot">.</span></h2></div><span class="link">לכל הכובעים ←</span></div></body>
</html>
