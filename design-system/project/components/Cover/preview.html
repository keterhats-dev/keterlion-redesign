<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>KETERLION — cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400&family=Arvo:wght@700&display=swap">
<style>
html,body{margin:0;background:var(--white,#fff)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--white,#fff)}
.art{position:absolute;left:480px;top:0;width:480px;height:288px}
.k{fill:var(--black,#171717)}
.c{fill:var(--cream,#f4eee1)}
.g{fill:var(--gold,#ae8e42)}
.r{fill:var(--red,#c21a1a)}
.rule{stroke:var(--line,#ddd3bd);stroke-width:var(--hairline,1px);fill:none}
.tb{position:absolute;left:32px;bottom:32px;max-width:440px}
.nm{font-family:Rockwell,"Rockwell Nova",Arvo,serif;font-weight:700;font-size:80px;line-height:.92;letter-spacing:.06em;color:var(--black,#171717);margin:0}
.tg{font-family:Heebo,Arial,sans-serif;font-size:14px;color:var(--grey,#6b6b69);margin:12px 0 0;direction:ltr}
</style></head>
<body>
<div class="cv">
  <svg class="art" viewBox="0 0 480 288" aria-hidden="true">
    <!--
      blocks: black slab 192×288 (bleeds top/bottom) · cream 192×128 · gold band 224×48 (bleeds right) · red 32×32 (state colour, small) · black disc r40 (radius-pill: the round sticker)
      arrangement: one tall slab with satellites, square corners (radius-none) except the disc
      pattern: editorial hairlines — README: "קווים דקים בבז'"; four 1px rules in line crossing the slab and the ground
      steps/radii: space-20 (80), space-8 (32), hairline (1px), radius-none (0), radius-pill
    -->
    <rect class="k" x="32" y="0" width="192" height="288"/>
    <rect class="c" x="224" y="64" width="192" height="128"/>
    <rect class="g" x="256" y="192" width="224" height="48"/>
    <rect class="r" x="448" y="32" width="32" height="32"/>
    <circle class="k" cx="352" cy="128" r="40"/>
    <line class="rule" x1="0" y1="24" x2="480" y2="24"/>
    <line class="rule" x1="0" y1="256" x2="480" y2="256"/>
    <line class="rule" x1="0" y1="264" x2="480" y2="264"/>
    <line class="rule" x1="0" y1="272" x2="480" y2="272"/>
  </svg>
  <div class="tb">
    <h1 class="nm">KETERLION</h1>
    <p class="tg">It's all in your head · Israeli hats, Tel Aviv, since 2016</p>
  </div>
</div>
</body>
</html>
