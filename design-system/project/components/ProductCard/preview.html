<!-- @dsCard group="Commerce" height=380 -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>ProductCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#171717);background:var(--white,#fff)}
.grid{display:grid;grid-template-columns:repeat(3,220px);gap:24px;padding:16px}
.card{display:flex;flex-direction:column;gap:14px}
/* no frame around the photo (29.10.2026); hover shows the next photo */
.im{position:relative;aspect-ratio:4/5;background:var(--white,#fff);display:grid;place-items:center}
.ph{grid-area:1/1;width:62%;height:34%;background:var(--black,#171717);border-radius:50% 50% 8px 8px / 70% 70% 8px 8px;transition:opacity .15s}
.ph.g{background:var(--grey,#6b6b69)}
.ph.next{opacity:0;transform:scaleX(-1)}
.card:hover .ph.first{opacity:0}
.card:hover .ph.next{opacity:1}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line,#ddd3bd)}
.dots i:first-child{background:var(--black,#171717)}
.card:hover .dots i:first-child{background:var(--line,#ddd3bd)}
.card:hover .dots i:nth-child(2){background:var(--black,#171717)}
.nav{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--white,#fff);border:1px solid var(--line,#ddd3bd);border-radius:4px;font-size:16px;opacity:0;transition:opacity .15s}
.nav.prev{right:8px}.nav.nxt{left:8px}
.card:hover .nav{opacity:1}
.nav:hover{border-color:var(--black,#171717)}
.tag{position:absolute;top:12px;right:12px;z-index:1;font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 10px;background:var(--black,#171717);color:var(--white,#fff)}
.tag.new{color:var(--gold,#ae8e42)}
.tag.sale{background:var(--red,#c21a1a)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:500}
.pr{font-variant-numeric:tabular-nums}
.pr s{color:var(--grey,#6b6b69);margin-left:6px}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="im"><span class="tag new">חדש</span><span class="ph first"></span><span class="ph next"></span><span class="nav prev">→</span><span class="nav nxt">←</span><span class="dots"><i></i><i></i><i></i></span></div><div class="row"><span>כלום לא סתם · קלאסי</span><span class="pr">₪___</span></div></div>
  <div class="card"><div class="im"><span class="ph g first"></span><span class="ph g next"></span><span class="nav prev">→</span><span class="nav nxt">←</span><span class="dots"><i></i><i></i></span></div><div class="row"><span>Piece of God · Dad Cap</span><span class="pr">₪___</span></div></div>
  <div class="card"><div class="im"><span class="tag sale">מבצע</span><span class="ph first"></span><span class="ph next"></span><span class="nav prev">→</span><span class="nav nxt">←</span><span class="dots"><i></i><i></i><i></i></span></div><div class="row"><span>Go A Head · Dad Cap</span><span class="pr"><s>₪___</s>₪___</span></div></div>
</div>
</body>
</html>
