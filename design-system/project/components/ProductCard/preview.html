<!-- @dsCard group="Commerce" height=360 -->
<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>ProductCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#111)}
.grid{display:grid;grid-template-columns:repeat(3,200px);gap:14px;padding:16px}
.im{position:relative;aspect-ratio:1;background:var(--white,#fff);border:1px solid var(--line,#e2e2df);display:grid;place-items:center}
.card:hover .im{border-color:var(--black,#111)}
.ph{width:62%;height:44%;background:var(--black,#111);border-radius:50% 50% 8px 8px / 70% 70% 8px 8px}
.ph.g{background:var(--grey,#6b6b69)}
.tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 8px;background:var(--black,#111);color:#fff}
.tag.new{background:var(--gold,#e6d6ae);color:var(--black,#111)}
.tag.sale{background:var(--red,#c21a1a)}
.add{position:absolute;inset:auto 8px 8px;height:34px;background:var(--black,#111);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
h4{margin:10px 0 2px;font-size:16px;font-weight:700}
.m{font-size:13px;color:var(--grey,#6b6b69)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pr{font-weight:700;font-variant-numeric:tabular-nums}
.pr s{color:var(--grey,#6b6b69);font-weight:400;margin-left:6px}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line,#e2e2df)}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="im"><span class="tag new">חדש</span><span class="ph"></span><span class="add">הוספה מהירה +</span></div><h4>כלום לא סתם</h4><div class="m">Dad Cap · מיינדסט</div><div class="row"><span class="pr">₪149</span><span class="dots"><i style="background:#8a63c9"></i></span></div></div>
  <div class="card"><div class="im"><span class="ph g"></span></div><h4>Piece of God</h4><div class="m">Dad Cap · KETERLION</div><div class="row"><span class="pr">₪149</span><span class="dots"><i style="background:#444"></i><i style="background:#d8d2b8"></i></span></div></div>
  <div class="card"><div class="im"><span class="tag sale">מבצע</span><span class="ph"></span></div><h4>Go A Head</h4><div class="m">Dad Cap · שחור משופשף</div><div class="row"><span class="pr"><s>₪149</s>₪129</span><span class="dots"><i style="background:#1a1a1a"></i></span></div></div>
</div>
</body>
</html>
