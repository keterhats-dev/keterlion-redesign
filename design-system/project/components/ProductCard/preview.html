<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>ProductCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#171717);background:var(--white,#fff)}
.grid{display:grid;grid-template-columns:repeat(3,220px);gap:24px;padding:16px}
.card{display:flex;flex-direction:column;gap:14px}
.im{position:relative;aspect-ratio:4/5;background:var(--white,#fff);border:1px solid var(--line,#ddd3bd);display:grid;place-items:center}
.card:hover .im{border-color:var(--black,#171717)}
.ph{width:62%;height:34%;background:var(--black,#171717);border-radius:50% 50% 8px 8px / 70% 70% 8px 8px}
.ph.g{background:var(--grey,#6b6b69)}
.tag{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 10px;background:var(--black,#171717);color:var(--white,#fff)}
.tag.new{color:var(--gold,#ae8e42)}
.tag.sale{background:var(--red,#c21a1a)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:500}
.pr{font-variant-numeric:tabular-nums}
.pr s{color:var(--grey,#6b6b69);margin-left:6px}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="im"><span class="tag new">חדש</span><span class="ph"></span></div><div class="row"><span>כלום לא סתם · קלאסי</span><span class="pr">₪___</span></div></div>
  <div class="card"><div class="im"><span class="ph g"></span></div><div class="row"><span>Piece of God · Dad Cap</span><span class="pr">₪___</span></div></div>
  <div class="card"><div class="im"><span class="tag sale">מבצע</span><span class="ph"></span></div><div class="row"><span>Go A Head · Dad Cap</span><span class="pr"><s>₪___</s>₪___</span></div></div>
</div>
</body>
</html>
