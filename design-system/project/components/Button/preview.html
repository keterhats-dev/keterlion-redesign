<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#111)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px}
.dark{background:var(--black,#111)}
.btn{display:inline-flex;align-items:center;height:50px;padding:0 26px;font-weight:700;font-size:15px;border:1.5px solid var(--black,#111);background:var(--black,#111);color:var(--white,#fff)}
.out{background:transparent;color:var(--black,#111)}
.light{background:var(--white,#fff);color:var(--black,#111);border-color:var(--white,#fff)}
.light-out{background:transparent;color:var(--white,#fff);border-color:var(--white,#fff)}
.link{font-weight:700;font-size:14px;border-bottom:2px solid var(--gold-deep,#a88a4e);padding-bottom:2px}
</style></head>
<body>
<div class="row"><span class="btn">הוספה לסל</span><span class="btn out">פרטים נוספים</span><span class="link">לכל הכובעים</span></div>
<div class="row dark"><span class="btn light">למחשבון המחירים</span><span class="btn light-out">WhatsApp לנציג</span></div>
</body>
</html>
