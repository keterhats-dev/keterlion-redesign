<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap">
<style>
body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--black,#171717);background:var(--white,#fff)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px}
.dark{background:var(--black,#171717)}
.btn{display:inline-flex;align-items:center;min-height:56px;padding:0 30px;font-weight:700;font-size:17px;border-radius:var(--radius-sm,4px);background:var(--black,#171717);color:var(--white,#fff);border:1px solid var(--black,#171717)}
.out{background:transparent;color:var(--black,#171717)}
.light{background:var(--white,#fff);color:var(--black,#171717);border-color:var(--white,#fff)}
.gold{background:var(--gold,#ae8e42);color:var(--black,#171717);border-color:var(--gold,#ae8e42)}
.arrow{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-sm,4px);background:var(--black,#171717);color:var(--white,#fff);font-size:24px}
.link{font-weight:700;font-size:16px;border-bottom:2px solid var(--gold,#ae8e42);padding-bottom:3px}
</style></head>
<body>
<div class="row"><span class="btn">לכל הכובעים ←</span><span class="btn out">עצבו כובע משלכם</span><span class="arrow" aria-hidden="true">←</span><span class="link">לכל הכובעים ←</span></div>
<div class="row dark"><span class="btn gold">לבקשת הצעת מחיר ←</span><span class="btn light">WhatsApp</span></div>
</body>
</html>
