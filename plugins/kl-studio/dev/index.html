<!doctype html>
<html lang="he" dir="rtl">
<head>

<body>

<div class="page"><div id="kl-studio"></div></div>
<script>
/* Builds the same config that includes/model.php → kls_front_config() produces, from the plugin's own data files. */
fetch('../assets/data/cap-model.json').then(function (r) { return r.json(); }).then(function (m) {
  var price = { dad: 100, baseball: 109 };
  var cfg = {
    demo: true, currency: '₪', imageSize: m.imageSize, viewBox: [32, 170, 960, 640],
    sides: ['front', 'right', 'left', 'back'], sideLabels: { front: 'חזית', right: 'צד ימין', left: 'צד שמאל', back: 'מאחור' },
    shapes: m.shapes,
    variants: m.variants.map(function (v) { var img = {}; ['front', 'right', 'left', 'back'].forEach(function (s) { img[s] = '../assets/caps/' + v.id + '-' + s + '.jpg'; }); return { id: v.id, shape: v.shape, slug: v.slug, name: v.name, hex: v.hex, front: v.front, price: price[v.shape], stock: true, img: img }; }),
    threads: [['2150','שחור','#141414'],['2149','לבן','#F6F6F2'],['2296','כסף כהה','#8E9196'],['2275','בז׳','#D9C49A'],['2290','חום בהיר','#A57A4E'],['2135','חום','#5A3A22'],['2050','כתום','#EE7A1E'],['2005','צהוב ניאון','#DDEB1C'],['2182','אדום בהיר','#D8343A'],['2166','ורוד','#EE86B2'],['2084','סגול','#6A3C99'],['2085','שזיף','#6E2A5A'],['2069','כחול רויאל','#1F4FB5'],['2066','כחול רויאל בהיר','#3E7BD8'],['2073','נייבי','#1E2848'],['2242','ירוק','#1E7A3C'],['2250','ירוק עלה','#6BAE3A']].map(function (t) { return { code: t[0], name: t[1], hex: t[2] }; }),
    fonts: [{ id: 'block', name: 'בלוק', css: "'Heebo',sans-serif", w: 900 }, { id: 'street', name: 'רחוב', css: "'Karantina',sans-serif", w: 700 }, { id: 'classic', name: 'קלאסי', css: "'Frank Ruhl Libre',serif", w: 900 }, { id: 'round', name: 'עגול', css: "'Secular One',sans-serif", w: 400 }, { id: 'hand', name: 'כתב יד', css: "'Amatic SC',sans-serif", w: 700 }],
    prices: { type: { gallery: 50, text: 79, logo: 129 }, extra: 35, tiers: [{ min: 2, max: 5, add: 50 }, { min: 6, max: 9, add: 10 }, { min: 10, max: 23, add: 0 }], maxQty: 23 },
    text: { max: 18, minLetter: 0.8 }, upload: { maxMb: 10 },
    logoRules: ['אותיות בגובה 0.8 ס״מ לפחות', 'עד 4 צבעים, בלי מעברי צבע, צללים או תמונות', 'בחזית עד 12 ס״מ ברוחב ו-5.5 ס״מ בגובה', 'אחרי ההזמנה בודקים כל לוגו. אם הוא לא מתאים לרקמה, נחזור אליכם ב-WhatsApp ונתאים אותו יחד. אם לא נמצא פתרון, תקבלו החזר כספי'],
    facts: { delivery: 'עד 7 ימים', list: ['סקיצה לאישור ב-WhatsApp לפני שרוקמים', 'עד 7 ימים מההזמנה'] },
    b2bUrl: '#', showTitle: true, galleryUrl: '../assets/data/gallery.json', ajax: { upload: '#', add: '#' }, nonce: 'demo'
  };
  var el = document.createElement('script'); el.type = 'application/json'; el.id = 'kls-config'; el.textContent = JSON.stringify(cfg); document.body.appendChild(el);
  var s = document.createElement('script'); s.src = '../assets/studio.js?' + Date.now(); document.body.appendChild(s);
});
</script>
</body>
</html>
